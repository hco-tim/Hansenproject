name: Website Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - audit-optimization

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run production build
        run: npm run build
      - name: Run ESLint
        run: npm run lint
