name: Website Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - audit-optimization

permissions:
  contents: write

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile and commit npm lockfile
        if: github.event_name == 'push'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Convert embedded CMS images to optimized WebP files
        if: github.event_name == 'push'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund sharp
          node scripts/optimize-inline-images.mjs
          git add content.json public/uploads/site
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "perf: move embedded CMS images to optimized WebP files [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Run production build
        run: npm run build
      - name: Run ESLint
        run: npm run lint
